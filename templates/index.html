<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .container { max-width: 400px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; margin-bottom: 20px; }
        input, button { padding: 8px; margin: 8px 0; width: 100%; }
        .result { margin-top: 16px; font-weight: bold; }
        .suggestions { color: red; }
        .generated { color: green; }
        .strong { color: green; }
        .weak { color: red; }
        .generated-password { color: green; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Password Checker</h2>
        <form id="checkForm">
            <label for="password">Enter Your Password:</label>
            <input type="password" id="password" name="password" required>
            <button type="submit">Check Password</button>
        </form>
        <div class="result" id="checkResult"></div>
    </div>
    <div class="container">
        <h2>Password Generator</h2>
        <form id="passwordForm">
            <label for="length">Password Length:</label>
            <input type="number" id="length" name="length" min="4" max="64" value="12" required>
            <button type="submit">Generate Password</button>
        </form>
        <div class="result" id="result"></div>
    </div>
    <script src="/static/password_api.js"></script>
    <script>
        document.getElementById('passwordForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const length = document.getElementById('length').value;
            try {
                const password = await requestPassword(length);
                const escapedPassword = password.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                document.getElementById('result').innerHTML = 'Generated Password: <span class="generated-password">' + escapedPassword + '</span>';
            } catch (err) {
                document.getElementById('result').textContent = 'Error: ' + err.message;
            }
        });

        document.getElementById('checkForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            try {
                const result = await checkPassword(password);
                let output = '';
                if (result.is_strong) {
                    output = '<span class="strong">Your password is strong!</span>';
                } else {
                    output = '<span class="weak">Your password is weak.</span><br>Suggestions:<br>' + result.suggestions.map(s => '- ' + s).join('<br>');
                    output += '<br><br>Generated strong passwords:<br>' + result.generated.map(p => {
                        const escaped = p.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
                        return '<span class="generated-password">- ' + escaped + '</span>';
                    }).join('<br>');
                }
                document.getElementById('checkResult').innerHTML = output;
            } catch (err) {
                document.getElementById('checkResult').textContent = 'Error: ' + err.message;
            }
        });
    </script>
</body>
</html>
